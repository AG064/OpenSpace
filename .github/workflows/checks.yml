name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q openspace gdpval_bench
      - run: python -c "import pathlib,tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text())"
